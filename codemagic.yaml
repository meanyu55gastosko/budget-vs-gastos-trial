    scripts:
      - name: Restore App + Set Name + Icon
        script: |
          echo "=== RESTORE YOUR BUDGET CODE ==="
          git checkout main -- lib/ assets/ pubspec.yaml 2>/dev/null || git checkout HEAD -- lib/ assets/ || true
          git checkout c5f9933 -- lib/ || true
          ls -lh assets/icon.png
          cat lib/main.dart | head -10

          echo "=== KEEP FRESH ANDROID FROM FLUTTER 3.32.8 (AGP 8.7.3) ==="
          rm -rf android
          flutter create --platforms=android --org com.rasmobilelabs --project-name gastosko .
          git checkout main -- lib/ assets/ pubspec.yaml 2>/dev/null || git checkout HEAD -- lib/ assets/ || true
          git checkout c5f9933 -- lib/ || true

          echo "=== SET APP NAME TO Gastos Ko ==="
          sed -i '' 's/android:label="[^"]*"/android:label="Gastos Ko"/' android/app/src/main/AndroidManifest.xml 2>/dev/null || sed -i 's/android:label="[^"]*"/android:label="Gastos Ko"/' android/app/src/main/AndroidManifest.xml

          echo "=== INJECT QUERIES FOR URL LAUNCHER SAFELY ==="
          cat > queries_block.txt <<'EOF'
              <queries>
                  <intent>
                      <action android:name="android.intent.action.PROCESS_TEXT"/>
                      <data android:mimeType="text/plain"/>
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="https" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.SENDTO" />
                      <data android:scheme="mailto" />
                  </intent>
              </queries>
          EOF

          awk 'NR==FNR{a=a $0 "\n";next} /<application/{print a} 1' queries_block.txt android/app/src/main/AndroidManifest.xml > temp_manifest.xml
          mv temp_manifest.xml android/app/src/main/AndroidManifest.xml
          rm queries_block.txt
          
          echo "=== CHECKING INJECTED MANIFEST ==="
          cat android/app/src/main/AndroidManifest.xml | head -25

          echo "=== GENERATE ICON ==="
          cat > flutter_launcher_icons.yaml <<'EOF'
          flutter_icons:
            android: true
            ios: false
            image_path: "assets/icon.png"
            min_sdk_android: 24
          EOF
          flutter pub add flutter_launcher_icons --dev 2>/dev/null || true
          flutter pub get
          dart run flutter_launcher_icons || true
          ls android/app/src/main/res/mipmap-hdpi/ic_launcher.png && echo "ICON OK!"

      - name: Inject Secure Keystore and Signing Files
        script: |
          echo "=== RECONSTRUCT PHYSICAL KEYSTORE FROM BASE64 ==="
          echo "$BASE64_KEYSTORE" | base64 --decode > android/app/upload-keystore.jks

          echo "=== AUTO GENERATE CONFIGURATION SIGNING FIELDS ==="
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

          echo "=== INJECT KOTLIN DSL PRODUCTION SIGNING IN BUILD.GRADLE.KTS ==="
          cat > android/app/build.gradle.kts <<'EOF'
          import java.util.Properties
          import java.io.FileInputStream

          plugins {
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
          }

          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          android {
              namespace = "com.rasmobilelabs.gastosko"
              compileSdk = 36
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_11
                  targetCompatibility = JavaVersion.VERSION_11
              }

              kotlinOptions {
                  jvmTarget = JavaVersion.VERSION_11.toString()
                }

              defaultConfig {
                  applicationId = "com.rasmobilelabs.gastosko"
                  minSdk = 24
                  targetSdk = 36
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName
              }

              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties.getProperty("keyAlias")
                      keyPassword = keystoreProperties.getProperty("keyPassword")
                      storeFile = keystoreProperties.getProperty("storeFile")?.let { file(it) }
                      storePassword = keystoreProperties.getProperty("storePassword")
                  }
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }

              configurations.all {
                  resolutionStrategy.eachDependency {
                      if (requested.group == "com.android.billingclient" && requested.name == "billing") {
                          useVersion("8.0.0")
                      }
                  }
              }
          }

          flutter {
              source = "../.."
          }
          EOF

      - name: Build Protected AAB for Google Console Compliance
        script: |
          flutter clean
          flutter pub get
          flutter build appbundle --release --obfuscate --split-debug-info=./symbols --no-tree-shake-icons --build-number=4

    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - symbols/*.symbols
